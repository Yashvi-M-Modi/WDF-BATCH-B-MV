<html lang="en">

    <title>Feedback</title>

</head>
<body>

            <h1>FEEDBACK</h1>
            <a href="homepage.html"><button type="button">HOME</button></a>
            <button type="button" id="themeButton" onclick="changetheme()">
            🌙 Dark Mode
        </button>
    </header>
    <div class="feedback">
    <form>
        <label>Name:</label>
        <input type="text" required><br><br>

        <label>Subject: </label>
        <select>
            <option>WDF</option>
            <option>OOP</option>
            <option>DSA</option>
            <option>DM</option>
            <option>CN</option>
        </select><br><br>

        <label>Feedback: </label>

        <input type="radio" name="Feedback"> Good
        <input type="radio" name="Feedback"> Average

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>
    </div>
    <script src = "theme.js"></script>

</html>
