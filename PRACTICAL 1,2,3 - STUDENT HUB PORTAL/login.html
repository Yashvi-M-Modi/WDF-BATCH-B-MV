<!DOCTYPE html>
<html>

<head>

<title>Login Page</title>

<style>

body{
background:white;
font-family:Arial;
}

.box{

width:300px;
height:300px;
background:#A52A2A;

margin-left:auto;
margin-right:auto;
margin-top:120px;

padding:20px;

color:white;

}

h1{

text-align:center;

}

input{

width:280px;

height:30px;

margin-top:8px;

margin-bottom:15px;

}

button{

width:100px;

height:35px;

background:beige;

color:#A52A2A;

border:1px solid brown;

margin-left:90px;

}

button:hover{

background:white;

}

</style>

</head>

<body>

<div class="box">

<h1>Login</h1>

<form>

Username <br>

<input type="text">

<br>

Password <br>

<input type="password">

<br>

<button type="button">

Login

</button>

</form>

</div>

</body>

</html>
